[package]
name = "temci"
version = "0.8.5"
edition = "2021"
authors = ["Johannes Hofmeister <johannes.hofmeister@gmail.com>"]
description = "Advanced benchmarking tool"
license = "GPL-3.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
statrs = "0.16"
sysinfo = "0.30"
regex = "1"
chrono = "0.4"
itertools = "0.12"
futures = "0.3"
termcolor = "1.4"
which = "6.0"
async-trait = "0.1"
tempfile = "3"
num_cpus = "1.17.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "temci"
path = "src/main.rs"
